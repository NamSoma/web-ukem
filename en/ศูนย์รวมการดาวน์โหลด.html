        <style>
            .download-list {
                max-width: 900px;
                margin: 60px auto;
                display: flex;
                flex-direction: column;
                gap: 20px;
            }
            .download-item {
                background: white;
                border: 1px solid var(--border-color);
                border-radius: 0px;
                padding: 25px 30px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                transition: all 0.3s ease;
                box-shadow: none;
            }
            .download-item:hover {
                transform: translateY(-3px);
                box-shadow: none;
                border-color: var(--primary);
            }
            .download-info {
                display: flex;
                align-items: center;
                gap: 20px;
            }
            .download-icon {
                width: 50px;
                height: 50px;
                background: var(--bg-light);
                color: #ef4444;
                border-radius: 0px;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .download-title {
                font-size: 18px;
                font-weight: 600;
                color: var(--primary);
                margin-bottom: 5px;
            }
            .download-desc {
                font-size: 14px;
                color: var(--text-muted);
            }
            .btn-download {
                padding: 10px 20px;
                background: var(--primary);
                color: white;
                text-decoration: none;
                border-radius: 0px;
                font-weight: 500;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                transition: background 0.3s ease;
            }
            .btn-download:hover {
                background: var(--primary-dark);
            }
            .section-label {
                font-size: 24px;
                font-weight: 700;
                color: var(--primary);
                margin-bottom: 15px;
                margin-top: 40px;
                
                display: inline-block;
            }
        </style>
